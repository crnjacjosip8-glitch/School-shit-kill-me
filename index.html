<style>

tems:center;border:1px solid #222a32;border-radius:13px;background:#12171c;padding:10px;min-width:0;cursor:pointer}.lesson+.lesson{margin-top:6px}.lessoncolor{align-self:stretch;border-radius:5px;background:var(--blue)}.lessonnum{font-size:10px;color:var(--muted);font-weight:800}.lessontitle{font-size:12px;font-weight:700}.lessontime{font-size:10px;color:var(--muted);margin-top:3px}.lessonbadge{font-size:9px;border-radius:7px;border:1px solid #29323c;background:#171c23;padding:4px 5px;color:#a0aab6}.empty{padding:23px 12px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #2a323c;border-radius:14px}.note-card{border:1px solid #222a32;background:linear-gradient(145deg,#151a20,#11161b);border-radius:16px;padding:14px;display:block;width:100%;text-align:left}.note-card:hover{border-color:#49427d}.note-title{font-size:12px;font-weight:750}.note-preview{font-size:11px;color:var(--muted);margin-top:5px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pill{font-size:9px;color:#aca5ff;background:#262343;border-radius:7px;padding:4px 6px;white-space:nowrap}.note-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.filterrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.search{border:1px solid var(--border);background:#11161b;border-radius:10px;padding:9px 11px;width:100%;color:var(--text);font-size:12px;min-width:0}.searchwrap{width:min(220px,55%)}.modal-backdrop{position:fixed;inset:0;background:#05070bd9;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:14px;backdrop-filter:blur(7px)}.modal{width:100%;max-width:520px;border:1px solid #343d49;background:#151a20;border-radius:23px;padding:18px;box-shadow:0 25px 90px #0009;max-height:85vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.modalhead h2{font-size:17px;margin:0}.close{width:31px;height:31px;border:1px solid #2b333d;background:#1c232a;border-radius:9px;font-size:18px;color:#aeb7c2}.field{margin:0 0 12px}.field label{display:block;font-size:11px;font-weight:700;color:#b3bdc8;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #2d3641;background:#0e1318;border-radius:10px;color:#f1f4f8;padding:10px 11px;font-size:13px}.field textarea{min-height:140px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalactions{display:flex;justify-content:space-between;gap:8px;margin-top:17px}.modalactions .right{display:flex;gap:8px}.danger{color:#ff8eac;border-color:#573040;background:#241820}.fileinput{display:none}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;background:#272d35;color:#e9edf3;border:1px solid #3b4550;border-radius:12px;padding:10px 14px;font-size:12px;box-shadow:var(--shadow);transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.footnote{text-align:center;color:#596471;font-size:10px;margin:25px 0 0}.menu-options{display:grid;grid-template-columns:1fr;gap:8px}.menu-option{border:1px solid #29323b;background:#11161b;border-radius:13px;padding:13px;text-align:left;display:flex;align-items:center;gap:12px}.menu-icon{width:34px;height:34px;border-radius:10px;background:#242144;color:#b8b1ff;display:grid;place-items:center;font-size:16px}.menu-option strong{display:block;font-size:12px}.menu-option small{display:block;font-size:10px;color:var(--muted);margin-top:3px}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brandmark">G</span><span>Grades <span style="color:#777f8c;font-weight:500">/ school tracker</span></span></div>
    <div class="top-actions"><span class="mini-status"><i class="dot"></i> Saved on this device</span><button class="btn" id="exportBtn" title="Export a backup">⇩ <span>Export</span></button><button class="btn iconbtn" id="importBtn" title="Import a backup">↥</button><input type="file" id="importFile" class="fileinput" accept="application/json,.json"></div>
  </header>
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="grades">Grades</button><button class="tab" data-tab="schedule">Schedule</button><button class="tab" data-tab="notes">Notes</button><button class="tab plus" id="addBtn" aria-label="Add new item">＋</button>
  </nav>
  <main id="view"></main>
  <div class="footnote">Private by default · Stored locally in this browser · Export a backup before clearing browser data</div>
</div>
<div id="modalRoot"></div><div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY='grades.school-tracker.v1';
const COLORS=['#50a7ff','#c076ff','#f36fc2','#f3c64f','#48d9a7','#ff9462','#7d70ff'];
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=(s,opts={day:'2-digit',month:'2-digit'})=>new Intl.DateTimeFormat('en-GB',opts).format(parseISO(s));
const prettyDay=s=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'}).format(parseISO(s));
const weekdays=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const shortDays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const byDay=[0,1,2,3,4,5,6];
const DEFAULT_SUBJECTS=[
 ['Engleski',[]],['Hrvatski',[]],['Upravni postupak',[]],['Ustavni ustroj BiH',[2]],['Uredsko poslovanje',[2]],['Matematika',[]],['Daktilografija',[4]],['Francuski',[]],['Njemački',[]],['Obiteljsko pravo',[2]],['Politika i gospodarstvo',[3]],['Informatika',[5]],['Tjelesni',[5]],['POV',[]],['Ured za vježbu',[2]],['Vjeronauk',[]]
];
const DEFAULT_TESTS=[['Izborni test','2026-10-27'],['Politika i gospodarstvo','2026-10-29'],['Ustav','2026-11-03'],['Matematika','2026-11-04'],['Obiteljsko pravo','2026-11-09'],['Upravni postupak','2026-11-11'],['Uredsko poslovanje','2026-11-18'],['Francuski / Njemački','2026-11-20'],['Engleski','2026-11-26'],['Informatika','2026-11-27'],['Matematika','2026-12-02'],['Francuski / Njemački · zadaćnica','2026-12-04'],['Hrvatski · jezik','2026-12-09'],['Engleski','2026-12-10']];
const seed=()=>{
 const subjects=DEFAULT_SUBJECTS.map(([name,grades],i)=>({id:'s'+(i+1),name,grades:grades.map(v=>({id:uid(),value:v,date:todayISO()})),note:'',color:COLORS[i%COLORS.length]}));
 const lesson=(day,name,start,end,kind='class',color)=>({id:uid(),day,name,start,end,kind,color:color||COLORS[(day+name.length)%COLORS.length]});
 const lessons=[lesson(2,'Engleski','13:40','14:25'),lesson(2,'Hrvatski','14:30','15:15'),lesson(2,'Upravni postupak','15:20','16:00'),lesson(2,'Veliki odmor','16:00','16:20','break','#697380'),lesson(2,'Ustavni ustroj BiH','16:20','17:05'),lesson(2,'Uredsko poslovanje','17:10','17:55'),lesson(2,'Matematika','18:00','18:45'),lesson(2,'Slobodan čas','18:50','19:25','free','#697380')];
 return {version:1,subjects,lessons,tests:DEFAULT_TESTS.map(([name,date])=>({id:uid(),name,date})),attendance:{},selectedDate:todayISO(),selectedDay:new Date().getDay()===0?6:new Date().getDay()-1,sort:'added',startedAt:todayISO()};
};
let data;
try {const raw=localStorage.getItem(STORAGE_KEY);data=raw?JSON.parse(raw):seed();if(!data.subjects||!data.lessons||!data.tests) data=seed();} catch(e){data=seed()}
let activeTab='today',scheduleMode='day',selectedDay=data.selectedDay??2,searchTerm='',modalReturn=null;
const view=document.getElementById('view'),modalRoot=document.getElementById('modalRoot'),toastEl=document.getElementById('toast');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(e){notify('Could not save. Export a backup and check browser storage.')}}
let toastTimer;
function notify(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2400)}
function subjectById(id){return data.subjects.find(s=>s.id===id)}
function avg(subject){if(!subject?.grades?.length)return null;return subject.grades.reduce((a,g)=>a+Number(g.value),0)/subject.grades.length}
function allAverage(){const a=data.subjects.map(avg).filter(v=>v!==null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function avgClass(v){if(v===null)return '';return v>=4.5?'avg-green':v>=3.5?'avg-blue':v>=2.5?'avg-yellow':v>=1.5?'avg-orange':'avg-pink'}
function gradClass(v){return 'g'+Number(v)}
function classLessons(day){return data.lessons.filter(l=>l.day===day&&l.kind==='class').sort((a,b)=>a.start.localeCompare(b.start))}
function allLessons(day){return data.lessons.filter(l=>l.day===day).sort((a,b)=>a.start.localeCompare(b.start))}
function getDay(date){if(!data.attendance[date])data.attendance[date]={status:'',classes:{}};if(!data.attendance[date].classes)data.attendance[date].classes={};return data.attendance[date]}
function lessonStatus(date,lesson){const d=data.attendance[date];if(d?.status==='off')return '';const stored=d?.classes?.[lesson.id];if(stored)return stored;if(d?.status==='present'||d?.status==='absent')return d.status;if(date<todayISO()&&date>=(data.startedAt||todayISO())&&lesson.kind==='class')return 'absent';return ''}
function dateAttendanceStatus(date){const d=data.attendance[date];if(d?.status==='off')return 'off';const lessons=classLessons(dayForDate(date));if(!lessons.length)return d?.status==='present'?'present':d?.status==='absent'?'absent':'';const sts=lessons.map(l=>lessonStatus(date,l));const p=sts.filter(s=>s==='present').length,a=sts.filter(s=>s==='absent').length;if(p&&a)return 'partial';if(p===lessons.length)return 'present';if(a===lessons.length)return 'absent';if(p+a>0)return 'partial';return d?.status||''}
function attendanceStats(){let attended=0,missed=0,offDays=0,schoolDays=0,streak=0;const today=todayISO(),start=data.startedAt||today;const presentDates=[];for(let cursor=start;cursor<=today;){const entry=data.attendance[cursor];if(entry?.status==='off'){offDays++;const d=parseISO(cursor);d.setDate(d.getDate()+1);cursor=iso(d);continue;}const wd=dayForDate(cursor),ls=classLessons(wd);if(ls.length){schoolDays++;let p=0,a=0;ls.forEach(l=>{const st=lessonStatus(cursor,l);if(st==='present'){attended++;p++}else if(st==='absent'){missed++;a++}});if(p===ls.length)presentDates.push(cursor)}const d=parseISO(cursor);d.setDate(d.getDate()+1);cursor=iso(d)}const total=attended+missed;let cursor=today;for(let i=0;i<366&&cursor>=start;i++){const wd=dayForDate(cursor),ls=classLessons(wd);if(ls.length){const entry=data.attendance[cursor];if(entry?.status==='off'){const d=parseISO(cursor);d.setDate(d.getDate()-1);cursor=iso(d);continue;}if(ls.every(l=>lessonStatus(cursor,l)==='present'))streak++;else break;}const d=parseISO(cursor);d.setDate(d.getDate()-1);cursor=iso(d)}return {attended,missed,total,percent:total?Math.round(attended/total*100):0,offDays,schoolDays,streak}}
function dateForDay(day){const now=parseISO(todayISO());const todayDay=(now.getDay()+6)%7;now.setDate(now.getDate()+(day-todayDay));return iso(now)}
function dayForDate(s){const d=parseISO(s).getDay();return d===0?6:d-1}
function upcomingTests(){return data.tests.filter(t=>t.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date))}
function daysUntil(date){return Math.round((parseISO(date)-parseISO(todayISO()))/86400000)}
function testRows(limit=6){const tests=upcomingTests().slice(0,limit);if(!tests.length)return '<div class="empty">No upcoming tests. A rare moment of peace.</div>';return tests.map(t=>{const n=daysUntil(t.date);let label=n===0?'Today':n===1?'In 1 day':`In ${n} days`;return `<div class="testrow"><div class="countdown ${n<=2?'soon':''}">${label}</div><div><div class="testname">${esc(t.name)}</div><div class="testdate">${esc(fmtDate(t.date,{day:'2-digit',month:'2-digit'}))}</div></div><button class="testedit" data-action="edit-test" data-id="${t.id}" aria-label="Edit test">⋯</button></div>`}).join('')}
function miniHeatmap(){const end=parseISO(todayISO()),days=[];for(let i=24;i>=0;i--){let d=new Date(end);d.setDate(d.getDate()-i);const date=iso(d);days.push({date,status:dateAttendanceStatus(date),future:date>todayISO()})}return days.map(x=>`<button class="heatday ${x.status || ([0,6].includes(parseISO(x.date).getDay())?'off':'')} ${data.selectedDate===x.date?'selected':''}" title="${esc(fmtDate(x.date,{weekday:'short',day:'numeric',month:'short'}))}: ${x.status||'not marked'}" data-action="select-date" data-date="${x.date}" aria-label="Select ${x.date}"></button>`).join('')}
function statusButton(status,label,cls){return `<button class="btn ${cls}" data-action="mark-day" data-status="${status}">${label}</button>`}
function renderToday(){const date=data.selectedDate||todayISO();const stats=attendanceStats();const day=dayForDate(date);const lessons=allLessons(day);const classCount=lessons.filter(l=>l.kind==='class').length;const status=dateAttendanceStatus(date);const isToday=date===todayISO();return `
<div class="pagehead"><div><div class="eyebrow">Your school at a glance</div><h1>${isToday?'Today':esc(prettyDay(date))}</h1><p>${esc(prettyDay(date))}${isToday?' · Keep the streak alive.':''}</p></div><button class="btn" data-action="go-today">⌖ Today</button></div>
<section class="section"><div class="card">
 <div class="sectionhead"><h2>Attendance</h2><span class="sub">Since ${esc(fmtDate(data.startedAt||todayISO(),{day:'2-digit',month:'2-digit'}))} · ${status==='present'?'Present':status==='absent'?'Absent':status==='off'?'No school':status==='partial'?'Partially marked':'Not marked'}</span></div>
 <div class="attendance-actions">${statusButton('present','✓ &nbsp; I attended','present')}${statusButton('absent','× &nbsp; I missed school','absent')}${statusButton('off',isToday?'／ &nbsp; No school today':'／ &nbsp; Holiday / no school','off')}</div>
 <div class="stats">
  <div class="stat"><div class="value purple">${stats.total?stats.percent+'%':'—'}</div><div class="label">Class attendance</div></div>
  <div class="stat"><div class="value mint">${stats.attended}</div><div class="label">Classes attended</div></div>
  <div class="stat"><div class="value pink">${stats.missed}</div><div class="label">Classes missed</div></div>
  <div class="stat"><div class="value blue">${stats.schoolDays}</div><div class="label">School days</div></div>
  <div class="stat"><div class="value">${stats.streak}</div><div class="label">Attendance streak</div></div>
  <div class="stat"><div class="value">${stats.offDays}</div><div class="label">Days off</div></div>
 </div>
 <div class="line"></div><div class="heat-title"><span>Last 25 days</span><span>Tap a square to review a date</span></div><div class="heatmap">${miniHeatmap()}</div>
 <div class="legend"><span><i class="swatch p"></i> Present</span><span><i class="swatch a"></i> Absent</span><span><i class="swatch w"></i> Weekend / no school</span><span><i class="swatch" style="background:linear-gradient(135deg,#248c76 50%,#b33b6b 50%)"></i> Mixed</span></div>
 <p class="note-small">Attendance is counted by individual lessons, not just days. Past scheduled classes default to absent unless you mark them otherwise. <button class="text-link" data-action="edit-start-date">Change tracking start date</button></p>
 </div></section>
 <section class="section"><div class="sectionhead"><h2>${isToday?"Today's classes":'Classes · '+esc(shortDays[day])}</h2><span class="sub">${classCount} lessons${lessons.some(l=>l.kind==='break')?' + breaks':''}</span></div>
 ${lessons.length?`<div class="list">${lessons.map((l,i)=>{const st=lessonStatus(date,l);return `<div class="classrow"><div class="classnum">${i+1}</div><div class="classmain"><div class="classname">${esc(l.name)}</div><div class="classmeta">${esc(l.start)} – ${esc(l.end)}${l.kind==='break'?' · break':l.kind==='free'?' · free period':''}</div></div><div class="classstatus">${l.kind==='class'?`<button class="mark ${st==='present'?'onp':''}" data-action="mark-class" data-id="${l.id}" data-status="present" title="Mark present">P</button><button class="mark ${st==='absent'?'ona':''}" data-action="mark-class" data-id="${l.id}" data-status="absent" title="Mark absent">A</button>`:`<span class="lessonbadge">${l.kind==='break'?'Break':'Free'}</span>`}</div></div>`}).join('')}</div>`:`<div class="empty">No lessons added for ${esc(weekdays[day])}. Add them in Schedule using the ＋ menu.</div>`}</section>
 <section class="section"><div class="sectionhead"><h2>Upcoming tests</h2><button class="text-link" data-action="view-tests">View all ↗</button></div><div class="card" style="padding:5px 14px">${testRows(5)}</div></section>
 <section class="section"><div class="sectionhead"><h2>Grade overview</h2><button class="text-link" data-tab="grades">Open grades ↗</button></div>${renderOverallCard()}</section>`}
function renderOverallCard(){const average=allAverage(),graded=data.subjects.filter(s=>s.grades.length).length,total=data.subjects.length;const pct=average===null?0:Math.min(100,average/5*100);const dist=[1,2,3,4,5].map(g=>data.subjects.reduce((n,s)=>n+s.grades.filter(x=>Number(x.value)===g).length,0));const sum=dist.reduce((a,b)=>a+b,0)||1;return `<div class="card overall"><div class="ring" style="--progress:${pct}%"><strong>${average===null?'—':average.toFixed(2)}</strong></div><div><div class="overalltitle">Overall average</div><div class="overalltext">${graded} of ${total} subjects have grades, ${total-graded} still empty</div><div class="barline">${dist.map((n,i)=>`<i style="width:${n/sum*100}%;background:${['#ff568f','#ff9a62','#f3c64f','#50a7ff','#42dfad'][i]}"></i>`).join('')}</div></div></div>`}
function renderGrades(){let subjects=[...data.subjects];if(searchTerm)subjects=subjects.filter(s=>s.name.toLowerCase().includes(searchTerm.toLowerCase()));if(data.sort==='name')subjects.sort((a,b)=>a.name.localeCompare(b.name));else if(data.sort==='average')subjects.sort((a,b)=>(avg(b)??-1)-(avg(a)??-1));else if(data.sort==='added')subjects.sort((a,b)=>data.subjects.indexOf(a)-data.subjects.indexOf(b));return `<div class="pagehead"><div><div class="eyebrow">Track progress without the spreadsheet tragedy</div><h1>Grades</h1><p>Add a grade with one tap. Your averages update automatically.</p></div><button class="btn primary" data-action="add-subject">＋ Subject</button></div>
<section class="section">${renderOverallCard()}</section><div class="filterrow"><div class="sectionhead" style="margin:0"><h2>Subjects</h2><span class="sub">${subjects.length} shown</span></div><div style="display:flex;gap:6px;align-items:center"><div class="searchwrap"><input class="search" id="subjectSearch" placeholder="Search subjects…" value="${esc(searchTerm)}"></div><select class="sortpill" id="sortSubjects" aria-label="Sort subjects"><option value="added" ${data.sort==='added'?'selected':''}>Added</option><option value="name" ${data.sort==='name'?'selected':''}>A–Z</option><option value="average" ${data.sort==='average'?'selected':''}>Average</option></select></div></div>
<div class="subject-list">${subjects.map(s=>{const v=avg(s);return `<article class="subject-card"><div class="subjecttop"><div style="min-width:0"><div class="subjectname">${esc(s.name)}</div><div class="subjectmeta">${s.grades.length} ${s.grades.length===1?'grade':'grades'}${s.note?' · note saved':''}</div></div><div class="average ${avgClass(v)}">${v===null?'—':v.toFixed(2)}</div></div><div class="grade-history">${s.grades.length?s.grades.map(g=>`<button class="grade-chip ${gradClass(g.value)}" title="Remove grade ${g.value} · ${esc(g.date||'no date')}" data-action="remove-grade" data-sid="${s.id}" data-gid="${g.id}">${g.value} <span style="font-size:8px;opacity:.65">×</span></button>`).join(''):'<span class="tiny" style="padding-top:5px">No grades yet</span>'}</div><div class="grade-actions">${[1,2,3,4,5].map(g=>`<button class="gradeadd" data-action="add-grade" data-sid="${s.id}" data-grade="${g}" title="Add grade ${g}">${g}</button>`).join('')}</div><div class="subjectfoot"><button class="subtle-btn" data-action="edit-note" data-sid="${s.id}">✎ Note</button><button class="subtle-btn" data-action="edit-subject" data-sid="${s.id}">Edit subject</button></div></article>`}).join('')||'<div class="empty">No subjects match that search.</div>'}</div>`}
function renderSchedule(){const dayNames=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const chosen=scheduleMode==='week'?null:selectedDay;let html=`<div class="pagehead"><div><div class="eyebrow">Plan the week</div><h1>Schedule</h1><p>Edit any lesson by tapping its card.</p></div><button class="btn primary" data-action="add-lesson">＋ Lesson</button></div><div class="daypicker">${shortDays.slice(0,5).map((d,i)=>`<button class="daybtn ${scheduleMode==='day'&&selectedDay===i?'active':''}" data-action="pick-day" data-day="${i}">${d}</button>`).join('')}<button class="daybtn ${scheduleMode==='week'?'active':''}" data-action="pick-week">Week</button></div>`;
 if(scheduleMode==='week'){for(let d=0;d<7;d++){const ls=allLessons(d);html+=`<section class="weekgroup"><div class="weeklabel">${dayNames[d]} <span>${ls.filter(l=>l.kind==='class').length} classes</span></div>${ls.length?ls.map((l,i)=>lessonRow(l,i,d)).join(''):'<div class="empty" style="padding:12px">No lessons added</div>'}</section>`}}
 else {const ls=allLessons(chosen);html+=`<section class="weekgroup"><div class="weeklabel">${dayNames[chosen]} <span>${ls.filter(l=>l.kind==='class').length} lessons · ${esc(fmtDate(dateForDay(chosen),{day:'2-digit',month:'2-digit'}))}</span></div>${ls.length?ls.map((l,i)=>lessonRow(l,i,chosen)).join(''):'<div class="empty">No lessons added for this day yet.<br><br>Use <strong>＋ Lesson</strong> to build your timetable.</div>'}</section>`}
 html+=`<div class="note-small" style="margin-top:18px">Lesson attendance is tracked on the Today tab, by date and by class period. Breaks and free periods are not included in attendance totals.</div>`;return html}
function lessonRow(l,i,d){return `<div class="lesson" data-action="edit-lesson" data-id="${l.id}"><div class="lessoncolor" style="background:${esc(l.color)}"></div><div class="lessonnum">${String(i+1).padStart(1,'0')}</div><div style="min-width:0"><div class="lessontitle">${esc(l.name)}</div><div class="lessontime">${esc(l.start)} – ${esc(l.end)}</div></div><span class="lessonbadge">${l.kind==='class'?'Class':l.kind==='break'?'Break':'Free'}</span></div>`}
function renderNotes(){const subjects=[...data.subjects].sort((a,b)=>a.name.localeCompare(b.name));return `<div class="pagehead"><div><div class="eyebrow">Keep the useful bits</div><h1>Notes</h1><p>Notes are linked to subjects and saved as you type.</p></div><button class="btn" data-action="add-subject">＋ Subject</button></div><div class="list">${subjects.map(s=>`<button class="note-card" data-action="edit-note" data-sid="${s.id}"><div class="note-header"><div class="note-title">${esc(s.name)}</div><span class="pill">${s.note?.trim()?'Saved':'Empty'}</span></div><div class="note-preview">${esc(s.note?.trim()||'Tap to add a note…')}</div></button>`).join('')}</div>`}
function render(){document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));if(activeTab==='today')view.innerHTML=renderToday();if(activeTab==='grades')view.innerHTML=renderGrades();if(activeTab==='schedule')view.innerHTML=renderSchedule();if(activeTab==='notes')view.innerHTML=renderNotes()}
function setTab(t){activeTab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function modal(title,body,buttons=''){modalRoot.innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="Close">×</button></div>${body}${buttons}</section></div>`;}
function closeModal(){modalRoot.innerHTML=''}
function footerButtons(primaryText='Save',danger=''){return `<div class="modalactions">${danger?`<button type="button" class="btn danger" data-action="${danger.action}" ${danger.id?`data-id="${danger.id}"`:''}>${danger.label}</button>`:'<span></span>'}<div class="right"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${primaryText}</button></div></div>`}
function addSubjectModal(subject=null){modal(subject?'Edit subject':'Add a subject',`<form id="subjectForm"><div class="field"><label for="subjectName">Subject name</label><input id="subjectName" name="name" required maxlength="70" placeholder="e.g. Mathematics" value="${esc(subject?.name||'')}"></div><div class="field"><label for="subjectColor">Accent colour</label><select name="color" id="subjectColor">${COLORS.map(c=>`<option value="${c}" ${subject?.color===c?'selected':''}>${c===COLORS[0]?'Blue':c===COLORS[1]?'Violet':c===COLORS[2]?'Pink':c===COLORS[3]?'Yellow':c===COLORS[4]?'Mint':c===COLORS[5]?'Orange':'Purple'}</option>`).join('')}</select></div>${footerButtons('Save subject',subject?{action:'delete-subject',label:'Delete subject',id:subject.id}:'')}</form>`);const f=document.getElementById('subjectForm');f.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f),name=String(fd.get('name')).trim();if(!name)return;if(subject){subject.name=name;subject.color=fd.get('color')}else data.subjects.push({id:uid(),name,grades:[],note:'',color:fd.get('color')});save();closeModal();render();notify(subject?'Subject updated':'Subject added')})}
function noteModal(subject){modal(`Notes · ${subject.name}`,`<form id="noteForm"><div class="field"><label for="noteText">Your note</label><textarea id="noteText" name="note" maxlength="12000" placeholder="Revision reminders, topics to review, useful links…">${esc(subject.note||'')}</textarea></div><div class="tiny">Your note is stored locally and saved as you type.</div>${footerButtons('Save note')}</form>`);document.getElementById('noteText').addEventListener('input',e=>{subject.note=e.target.value;save()});document.getElementById('noteForm').addEventListener('submit',e=>{e.preventDefault();subject.note=document.getElementById('noteText').value;save();closeModal();render();notify('Note saved')})}
function startDateModal(){modal('Attendance tracking start',`<form id="startDateForm"><div class="field"><label for="startDate">First day to include</label><input id="startDate" name="date" type="date" required max="${todayISO()}" value="${esc(data.startedAt||todayISO())}"></div><p class="tiny">Past scheduled classes from this date onward count as missed until you mark the day or individual lessons as attended. Choose the first day you want included.</p>${footerButtons('Update start date')}</form>`);document.getElementById('startDateForm').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('startDate').value;if(!v||v>todayISO()){notify('Choose a date that is not in the future.');return}data.startedAt=v;save();closeModal();render();notify('Tracking start date updated')})}
function testModal(test=null){modal(test?'Edit upcoming test':'Add an upcoming test',`<form id="testForm"><div class="field"><label for="testName">Test or assignment</label><input id="testName" name="name" required maxlength="120" placeholder="e.g. English test" value="${esc(test?.name||'')}"></div><div class="field"><label for="testDate">Date</label><input id="testDate" type="date" name="date" required value="${esc(test?.date||todayISO())}"></div>${footerButtons(test?'Save changes':'Add test',test?{action:'delete-test',label:'Delete test',id:test.id}:'')}</form>`);document.getElementById('testForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')).trim(),date=String(fd.get('date'));if(!name||!date)return;if(test){test.name=name;test.date=date}else data.tests.push({id:uid(),name,date});save();closeModal();render();notify(test?'Test updated':'Test added')})}
function lessonModal(lesson=null){const currentDay=lesson?.day??selectedDay;modal(lesson?'Edit lesson':'Add a lesson',`<form id="lessonForm"><div class="field"><label for="lessonName">Lesson name</label><input id="lessonName" name="name" required maxlength="80" placeholder="e.g. Mathematics" value="${esc(lesson?.name||'')}"></div><div class="formgrid"><div class="field"><label for="lessonDay">Day</label><select id="lessonDay" name="day">${weekdays.map((d,i)=>`<option value="${i}" ${currentDay===i?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label for="lessonKind">Type</label><select id="lessonKind" name="kind"><option value="class" ${lesson?.kind==='class'||!lesson?'selected':''}>Class</option><option value="break" ${lesson?.kind==='break'?'selected':''}>Break</option><option value="free" ${lesson?.kind==='free'?'selected':''}>Free period</option></select></div></div><div class="formgrid"><div class="field"><label for="lessonStart">Starts</label><input id="lessonStart" name="start" type="time" required value="${esc(lesson?.start||'08:30')}"></div><div class="field"><label for="lessonEnd">Ends</label><input id="lessonEnd" name="end" type="time" required value="${esc(lesson?.end||'09:15')}"></div></div><div class="field"><label for="lessonColor">Accent colour</label><select id="lessonColor" name="color">${COLORS.map(c=>`<option value="${c}" ${lesson?.color===c?'selected':''}>${c===COLORS[0]?'Blue':c===COLORS[1]?'Violet':c===COLORS[2]?'Pink':c===COLORS[3]?'Yellow':c===COLORS[4]?'Mint':c===COLORS[5]?'Orange':'Purple'}</option>`).join('')}</select></div>${footerButtons(lesson?'Save changes':'Add lesson',lesson?{action:'delete-lesson',id:lesson.id,label:'Delete lesson'}:'')}</form>`);document.getElementById('lessonForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),obj={name:String(fd.get('name')).trim(),day:Number(fd.get('day')),kind:String(fd.get('kind')),start:String(fd.get('start')),end:String(fd.get('end')),color:String(fd.get('color'))};if(!obj.name||obj.end<=obj.start){notify('Check the lesson name and times.');return}if(lesson)Object.assign(lesson,obj);else data.lessons.push({id:uid(),...obj});selectedDay=obj.day;scheduleMode='day';save();closeModal();activeTab='schedule';render();notify(lesson?'Lesson updated':'Lesson added')})}
function addMenu(){modal('Add something',`<div class="menu-options"><button class="menu-option" data-action="add-subject"><span class="menu-icon">▦</span><span><strong>Subject</strong><small>Add a class and track its grades and notes.</small></span></button><button class="menu-option" data-action="add-test"><span class="menu-icon">◷</span><span><strong>Test or assignment</strong><small>Add a deadline to your upcoming list.</small></span></button><button class="menu-option" data-action="add-lesson"><span class="menu-icon">☷</span><span><strong>Timetable lesson</strong><small>Build or edit your weekly schedule.</small></span></button></div>`)}
function markDay(status){const date=data.selectedDate||todayISO();if(status==='off'){data.attendance[date]={status:'off',classes:{}}}else{const d=getDay(date);d.status=status;d.classes=d.classes||{};const day=dayForDate(date);classLessons(day).forEach(l=>{d.classes[l.id]=status})}save();render();notify(status==='present'?'All classes marked present':status==='absent'?'All classes marked missed':'Marked as a day off')}
function markClass(id,status){const date=data.selectedDate||todayISO(),lesson=data.lessons.find(l=>l.id===id);if(!lesson)return;const d=getDay(date);if(d.status==='off')d.status='';d.classes[id]=lessonStatus(date,lesson)===status?'':status;const ls=classLessons(dayForDate(date)),sts=ls.map(l=>d.classes[l.id]||'');if(sts.length&&sts.every(s=>s==='present'))d.status='present';else if(sts.length&&sts.every(s=>s==='absent'))d.status='absent';else d.status='';save();render()}
function action(el){const a=el.dataset.action;if(!a)return;
 if(a==='close-modal'){closeModal();return}if(a==='backdrop'){closeModal();return}
 if(a==='add-subject'){closeModal();addSubjectModal();return}if(a==='add-test'){closeModal();testModal();return}if(a==='add-lesson'){closeModal();lessonModal();return}if(a==='add-grade'){const s=subjectById(el.dataset.sid);if(!s)return;s.grades.push({id:uid(),value:Number(el.dataset.grade),date:todayISO()});save();render();notify(`Grade ${el.dataset.grade} added to ${s.name}`);return}
 if(a==='remove-grade'){const s=subjectById(el.dataset.sid);if(!s)return;const g=s.grades.find(x=>x.id===el.dataset.gid);if(!g)return;s.grades=s.grades.filter(x=>x.id!==g.id);save();render();notify(`Grade ${g.value} removed`);return}
 if(a==='edit-subject'){const s=subjectById(el.dataset.sid);if(s)addSubjectModal(s);return}if(a==='edit-note'){const s=subjectById(el.dataset.sid);if(s)noteModal(s);return}
 if(a==='delete-subject'){const id=el.dataset.id;data.subjects=data.subjects.filter(s=>s.id!==id);save();closeModal();render();notify('Subject deleted');return}
 if(a==='edit-start-date'){startDateModal();return}if(a==='edit-test'){const t=data.tests.find(x=>x.id===el.dataset.id);if(t)testModal(t);return}if(a==='delete-test'){data.tests=data.tests.filter(t=>t.id!==el.dataset.id);save();closeModal();render();notify('Test removed');return}
 if(a==='delete-lesson'){data.lessons=data.lessons.filter(l=>l.id!==el.dataset.id);save();closeModal();render();notify('Lesson deleted');return}if(a==='edit-lesson'){const l=data.lessons.find(x=>x.id===el.dataset.id);if(l)lessonModal(l);return}
 if(a==='mark-day'){markDay(el.dataset.status);return}if(a==='mark-class'){markClass(el.dataset.id,el.dataset.status);return}
 if(a==='select-date'){data.selectedDate=el.dataset.date;save();render();return}if(a==='go-today'){data.selectedDate=todayISO();save();render();return}if(a==='pick-day'){selectedDay=Number(el.dataset.day);scheduleMode='day';data.selectedDay=selectedDay;save();render();return}if(a==='pick-week'){scheduleMode='week';render();return}if(a==='view-tests'){modal('Upcoming tests',`<div class="card" style="padding:5px 14px">${testRows(100)}</div><div style="margin-top:12px"><button class="btn primary" data-action="add-test">＋ Add test</button></div>`);return}
 }
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){if(tab.dataset.tab){setTab(tab.dataset.tab);return}}const el=e.target.closest('[data-action]');if(el){if(el.dataset.action==='backdrop'&&e.target!==el)return;action(el)}});
document.getElementById('addBtn').addEventListener('click',addMenu);
document.getElementById('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`grades-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(url);notify('Backup exported')});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.subjects)||!Array.isArray(obj.lessons)||!Array.isArray(obj.tests))throw Error('Invalid backup');data=obj;data.attendance=data.attendance||{};data.selectedDate=data.selectedDate||todayISO();save();render();notify('Backup imported')}catch(err){notify('That file is not a valid Grades backup')}e.target.value=''});
view.addEventListener('input',e=>{if(e.target.id==='subjectSearch'){searchTerm=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('subjectSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
view.addEventListener('change',e=>{if(e.target.id==='sortSubjects'){data.sort=e.target.value;save();render()}});
// Initial landing state
if(!data.selectedDate)data.selectedDate=todayISO();render();
})();
</script>
</body>
